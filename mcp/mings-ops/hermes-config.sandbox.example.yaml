    command: "node"
    args:
      - "/ABS/PATH/ON_THE_HERMES_HOST/mcp/mings-ops/index.mjs"
    env:
      MINGS_SUPABASE_URL: "https://glpdpkozvmfzgoewquxi.supabase.co"
      MINGS_AGENT_API_KEY: "replace-with-SANDBOX-AGENT_API_KEY"
      # Keep delete hidden (default):
      # MINGS_ENABLE_EXPENSE_DELETE: "true"
