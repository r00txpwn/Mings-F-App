name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    name: Typecheck, lint, build, unit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Staff production build
        run: npm run build:staff

      - name: Unit tests
        run: npm test

      - name: Test plan coverage (advisory)
        run: node scripts/qa-plan-coverage.mjs
        continue-on-error: true

      - name: Upload plan coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan-coverage-${{ github.run_number }}
          path: test-results/plan-coverage.json
          retention-days: 7
