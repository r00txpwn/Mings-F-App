# Supabase CLI config — https://supabase.com/docs/guides/cli/config
# Browser calls to Edge Functions send a CORS preflight (OPTIONS) without a JWT.
# If verify_jwt stays true (default), the gateway can reject OPTIONS → "CORS" / "Failed to fetch".
# Public order/payment functions validate inputs in code and use the service role server-side.

# Quoted keys avoid TOML parsing edge cases with hyphens.
[functions."online-order-create"]
verify_jwt = false

[functions."epoint-create-payment"]
verify_jwt = false

# Epoint server callbacks: no Supabase JWT; verify with data+signature (EPOINT_PRIVATE_KEY).
[functions."epoint-webhook"]
verify_jwt = false

# Internal manual reconcile: Bearer PAYMENT_RECONCILE_SECRET (no browser / customer use).
[functions."payment-reconcile"]
verify_jwt = false

[functions."united-payment-create-payment"]
verify_jwt = false

[functions."united-payment-return"]
verify_jwt = false

[functions."united-payment-webhook"]
verify_jwt = false

[functions."united-payment-status-check"]
verify_jwt = false

# Staff cockpit mutations — JWT validated inside function; service role writes + audit log.
[functions."admin-api"]
verify_jwt = false

# Staff payment re-check bridge — JWT validated inside function (admin/manager).
[functions."admin-payment-recheck"]
verify_jwt = false

# KDS status updates — gated by x-kds-secret (KDS_SECRET env) when set.
[functions."kds-order-status-update"]
verify_jwt = false

[functions."kds-item-prep-toggle"]
verify_jwt = false

# POS counter order creation — staff JWT validated inside function.
[functions."pos-order-create"]
verify_jwt = false

# Admin-only user CRUD — JWT validated inside function (admin role).
[functions."user-management"]
verify_jwt = false
